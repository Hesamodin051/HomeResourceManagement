<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه تدبیر منزل | ورود و ثبت‌نام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'vazir': ['Vazirmatn', 'sans-serif'] },
                    colors: { 'primary': '#0f172a', 'secondary': '#3b82f6', 'accent': '#f59e0b' }
                }
            }
        }
    </script>
</head>
<body class="font-vazir bg-gradient-to-br from-blue-50 to-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <i class="fas fa-home text-5xl text-secondary"></i>
            <h1 class="text-3xl font-bold text-primary mt-2">سامانه تدبیر منزل</h1>
            <p class="text-gray-500 text-sm mt-1">مدیریت هوشمند منابع خانگی</p>
        </div>

        <div class="card-modern p-6">
            <!-- تب‌ها -->
            <div class="flex border-b border-gray-200 mb-6">
                <button class="tab-btn active flex-1 py-2 text-center font-medium text-sm text-secondary border-b-2 border-secondary transition-all" data-tab="login">
                    <i class="fas fa-sign-in-alt ml-1"></i> ورود
                </button>
                <button class="tab-btn flex-1 py-2 text-center font-medium text-sm text-gray-400 hover:text-gray-600 transition-all" data-tab="register">
                    <i class="fas fa-user-plus ml-1"></i> ثبت‌نام
                </button>
            </div>

            <!-- فرم ورود -->
            <div id="loginForm" class="block">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">نام کاربری</label>
                        <input type="text" id="loginUsername" class="input-modern w-full" placeholder="نام کاربری خود را وارد کنید">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">رمز عبور</label>
                        <input type="password" id="loginPassword" class="input-modern w-full" placeholder="رمز عبور خود را وارد کنید">
                    </div>
                    <div id="loginError" class="text-red-500 text-sm text-center hidden"></div>
                    <button id="doLogin" class="btn-gradient w-full justify-center">
                        <i class="fas fa-sign-in-alt ml-2"></i> ورود
                    </button>
                </div>
            </div>

            <!-- فرم ثبت‌نام -->
            <div id="registerForm" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">نام کاربری</label>
                        <input type="text" id="regUsername" class="input-modern w-full" placeholder="حداقل ۳ کاراکتر">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">رمز عبور</label>
                        <input type="password" id="regPassword" class="input-modern w-full" placeholder="حداقل ۴ کاراکتر">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">تکرار رمز عبور</label>
                        <input type="password" id="regConfirm" class="input-modern w-full" placeholder="رمز عبور را تکرار کنید">
                    </div>
                    <div id="registerError" class="text-red-500 text-sm text-center hidden"></div>
                    <button id="doRegister" class="btn-gradient w-full justify-center">
                        <i class="fas fa-user-plus ml-2"></i> ثبت‌نام
                    </button>
                </div>
            </div>

            <!-- لینک ورود سازمانی -->
            <div class="mt-6 pt-4 border-t border-gray-200 text-center">
                <a href="org-login.html" class="text-sm text-gray-500 hover:text-secondary transition-colors">
                    <i class="fas fa-building ml-1"></i> ورود سازمان‌ها (پنل مدیریت)
                </a>
            </div>
        </div>

        <div class="text-center mt-4 text-xs text-gray-400">
            <i class="fas fa-shield-alt ml-1"></i> اطلاعات شما با امنیت کامل ذخیره می‌شود
        </div>
    </div>

    <script type="module">
        import { initAuthPage } from './modules/auth.js';
        initAuthPage();
    </script>
</body>
</html>

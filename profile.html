<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربر | سامانه تدبیر منزل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'vazir': ['Vazirmatn', 'sans-serif'] },
                    colors: { 'primary': '#0f172a', 'secondary': '#3b82f6', 'accent': '#f59e0b' }
                }
            }
        }
    </script>
    <style>
        .profile-avatar-container {
            position: relative;
            display: inline-block;
        }
        .profile-avatar-container .avatar-upload-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #3b82f6;
            color: white;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid white;
            transition: all 0.3s;
        }
        .profile-avatar-container .avatar-upload-btn:hover {
            background: #2563eb;
            transform: scale(1.1);
        }
        .profile-section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .profile-section-title i {
            color: #3b82f6;
            margin-left: 0.5rem;
        }
    </style>
</head>
<body class="font-vazir bg-gray-50 min-h-screen">
    <header class="glass-header sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-user-circle text-2xl text-secondary"></i>
                <h1 class="text-xl font-bold text-primary">پروفایل کاربر</h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='dashboard.html'" class="text-gray-500 hover:text-secondary transition-colors">
                    <i class="fas fa-arrow-left ml-1"></i> بازگشت
                </button>
                <div class="hamburger-menu cursor-pointer" id="hamburgerMenu">
                    <i class="fas fa-bars text-2xl text-gray-700"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="card-modern p-6">
            <!-- هدر پروفایل با آواتار -->
            <div class="flex flex-col sm:flex-row items-center gap-6 mb-6">
                <div class="profile-avatar-container">
                    <img id="profileAvatar" src="" alt="آواتار" class="w-24 h-24 rounded-full border-4 border-secondary object-cover">
                    <label for="avatarUpload" class="avatar-upload-btn">
                        <i class="fas fa-camera text-sm"></i>
                    </label>
                    <input type="file" id="avatarUpload" accept="image/*" class="hidden">
                </div>
                <div class="text-center sm:text-right">
                    <h2 class="text-2xl font-bold text-primary" id="profileDisplayName">کاربر</h2>
                    <p class="text-gray-500 text-sm" id="profileUsername">@username</p>
                    <span class="inline-block mt-1 text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full">
                        <i class="fas fa-check-circle ml-1"></i> فعال
                    </span>
                </div>
            </div>

            <!-- فرم پروفایل -->
            <form id="profileForm" class="space-y-6">
                <!-- بخش اطلاعات شخصی -->
                <div>
                    <h3 class="profile-section-title"><i class="fas fa-user"></i> اطلاعات شخصی</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نام و نام خانوادگی</label>
                            <input type="text" id="fullName" class="input-modern" placeholder="نام کامل خود را وارد کنید">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نام کاربری</label>
                            <input type="text" id="username" class="input-modern bg-gray-100" disabled>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">شماره تماس</label>
                            <input type="tel" id="phone" class="input-modern" placeholder="مثال: 09123456789">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">تاریخ تولد</label>
                            <input type="date" id="birthDate" class="input-modern">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">جنسیت</label>
                            <select id="gender" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="male">مرد</option>
                                <option value="female">زن</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">وضعیت تأهل</label>
                            <select id="maritalStatus" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="single">مجرد</option>
                                <option value="married">متأهل</option>
                                <option value="divorced">مطلقه</option>
                                <option value="widowed">بیوه</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">شغل</label>
                            <input type="text" id="occupation" class="input-modern" placeholder="شغل خود را وارد کنید">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">تعداد اعضای خانواده</label>
                            <input type="number" id="familySize" class="input-modern" min="1" placeholder="مثلاً ۴">
                        </div>
                    </div>
                </div>

                <!-- بخش اطلاعات مسکن -->
                <div>
                    <h3 class="profile-section-title"><i class="fas fa-home"></i> اطلاعات مسکن</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-1">آدرس کامل</label>
                            <textarea id="address" rows="2" class="input-modern" placeholder="آدرس خود را وارد کنید"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">کد پستی</label>
                            <input type="text" id="postalCode" class="input-modern" placeholder="کد پستی ۱۰ رقمی">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نوع مسکن</label>
                            <select id="housingType" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="owned">ملکی</option>
                                <option value="rental">اجاره‌ای</option>
                                <option value="other">سایر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">متراژ (متر مربع)</label>
                            <input type="number" id="area" class="input-modern" placeholder="مثلاً ۱۲۰">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">سال ساخت</label>
                            <input type="number" id="constructionYear" class="input-modern" placeholder="مثلاً ۱۳۹۰" min="1300" max="1405">
                        </div>
                    </div>
                </div>

                <!-- بخش اطلاعات انرژی -->
                <div>
                    <h3 class="profile-section-title"><i class="fas fa-bolt"></i> اطلاعات انرژی</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">سیستم گرمایشی</label>
                            <select id="heatingSystem" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="central">شوفاژ (مرکزی)</option>
                                <option value="radiator">رادیاتور (پکیج)</option>
                                <option value="underfloor">زیرزمینی</option>
                                <option value="electric">برقی</option>
                                <option value="gas">گازی (بخاری)</option>
                                <option value="solar">خورشیدی</option>
                                <option value="other">سایر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">سیستم سرمایشی</label>
                            <select id="coolingSystem" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="central">کولر گازی (اسپلیت)</option>
                                <option value="duct">کانال‌کشی</option>
                                <option value="window">پنجره‌ای</option>
                                <option value="portable">پرتابل</option>
                                <option value="evaporative">کولر آبی</option>
                                <option value="other">سایر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">نوع آبگرمکن</label>
                            <select id="waterHeater" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="electric">برقی</option>
                                <option value="gas">گازی (موتورخانه)</option>
                                <option value="solar">خورشیدی</option>
                                <option value="heatpump">پمپ حرارتی</option>
                                <option value="other">سایر</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">پنل خورشیدی</label>
                            <select id="solarPanel" class="input-modern">
                                <option value="">انتخاب کنید</option>
                                <option value="yes">دارد</option>
                                <option value="no">ندارد</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- بخش مصرف سالیانه -->
                <div>
                    <h3 class="profile-section-title"><i class="fas fa-chart-line"></i> مصرف سالیانه (اختیاری)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">آب (لیتر)</label>
                            <input type="number" id="annualWater" class="input-modern" placeholder="مصرف سالیانه آب">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">برق (کیلووات)</label>
                            <input type="number" id="annualElectricity" class="input-modern" placeholder="مصرف سالیانه برق">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">گاز (مترمکعب)</label>
                            <input type="number" id="annualGas" class="input-modern" placeholder="مصرف سالیانه گاز">
                        </div>
                    </div>
                </div>

                <!-- دکمه‌های اقدام -->
                <div class="flex flex-wrap gap-4 pt-4 border-t border-gray-200">
                    <button type="submit" class="btn-gradient flex-1 justify-center">
                        <i class="fas fa-save ml-2"></i> ذخیره تغییرات
                    </button>
                    <button type="button" id="resetProfileBtn" class="btn-outline flex-1 justify-center">
                        <i class="fas fa-undo ml-2"></i> بازنشانی
                    </button>
                    <button type="button" id="deleteAccountBtn" class="btn-danger flex-1 justify-center">
                        <i class="fas fa-trash-can ml-2"></i> حذف حساب کاربری
                    </button>
                </div>
            </form>

            <div id="profileStatus" class="mt-4 text-center text-sm hidden"></div>
        </div>
    </main>

    <!-- منوی کشو -->
    <div id="drawer" class="drawer-modern">
        <div class="flex justify-between items-center mb-6">
            <span class="text-lg font-bold text-primary">منو</span>
            <button id="closeDrawerBtn" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div id="drawerItems" class="space-y-2"></div>
    </div>
    <div id="drawerBackdrop"></div>

    <!-- ویجت چت‌بات -->
    <div id="chatbotWidget">
        <button class="chatbot-fab" id="chatbotFab"><i class="fas fa-robot"></i><span class="badge" id="chatbotBadge" style="display:none;">1</span></button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header"><div class="title"><span class="icon">🤖</span> دستیار هوشمند تدبیر</div><div><button class="close-btn" id="chatbotCloseBtn"><i class="fas fa-times"></i></button></div></div>
            <div class="chatbot-messages" id="chatbotMessages"><div class="message assistant">سلام! 👋<span class="time">اکنون</span></div><div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div></div>
            <div class="chatbot-input"><textarea id="chatbotInput" rows="1" placeholder="پیام..."></textarea><button class="send-btn" id="chatbotSendBtn"><i class="fas fa-paper-plane"></i></button></div>
        </div>
    </div>

    <script src="chatbot-widget.js"></script>
    <script src="menu.js"></script>
    <script type="module" src="profile.js"></script>
</body>
</html>

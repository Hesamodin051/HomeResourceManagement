<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت سازمانی | سامانه تدبیر منزل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'vazir': ['Vazirmatn', 'sans-serif'] },
                    colors: { 'primary': '#0f172a', 'secondary': '#3b82f6', 'accent': '#f59e0b' }
                }
            }
        }
    </script>
</head>
<body class="font-vazir bg-gray-50 min-h-screen">
    <!-- هدر -->
    <header class="bg-primary text-white sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-chart-pie text-2xl text-secondary"></i>
                <h1 class="text-xl font-bold">پنل مدیریت سازمانی</h1>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-300" id="adminOrgName">سازمان</span>
                <button id="logoutAdminBtn" class="text-gray-300 hover:text-white transition-colors">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- کارت‌های آماری -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6" id="statsCards">
            <!-- توسط JavaScript پر می‌شود -->
        </div>

        <!-- ابزارهای کنترل -->
        <div class="flex flex-wrap items-center justify-between gap-4 bg-white rounded-xl p-4 border border-gray-200 mb-6">
            <div class="flex items-center gap-3">
                <i class="fas fa-search text-gray-400"></i>
                <input id="adminSearchInput" type="text" placeholder="جستجوی کاربر..." class="input-modern !py-1 !px-3 w-48 md:w-64">
            </div>
            <div class="flex items-center gap-3">
                <button id="exportCSVBtn" class="btn-gradient !py-1 !px-4 text-sm">
                    <i class="fas fa-file-csv ml-1"></i> خروجی CSV
                </button>
                <button id="refreshAdminBtn" class="btn-outline !py-1 !px-4 text-sm">
                    <i class="fas fa-rotate ml-1"></i> بروزرسانی
                </button>
            </div>
        </div>

        <!-- نمودارها -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-xl p-4 border border-gray-200">
                <h3 class="text-sm font-bold text-gray-700 mb-3">📈 روند مصرف روزانه</h3>
                <canvas id="dailyChart" height="200"></canvas>
            </div>
            <div class="bg-white rounded-xl p-4 border border-gray-200">
                <h3 class="text-sm font-bold text-gray-700 mb-3">🥧 توزیع کل مصرف</h3>
                <canvas id="distributionChart" height="200"></canvas>
            </div>
        </div>

        <!-- پیش‌بینی مصرف -->
        <div class="bg-white rounded-xl p-4 border border-gray-200 mb-6">
            <h3 class="text-sm font-bold text-gray-700 mb-3">🔮 پیش‌بینی مصرف ۳۰ روز آینده</h3>
            <div id="forecastContainer"></div>
        </div>

        <!-- هشدارها -->
        <div class="bg-white rounded-xl p-4 border border-gray-200 mb-6">
            <h3 class="text-sm font-bold text-gray-700 mb-3">⚠️ هشدارهای مصرف</h3>
            <div id="alertsList"></div>
        </div>

        <!-- جدول کاربران -->
        <div class="bg-white rounded-xl p-4 border border-gray-200 overflow-hidden">
            <h3 class="text-sm font-bold text-gray-700 mb-3">👥 لیست کاربران</h3>
            <div class="overflow-x-auto">
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th>نام کاربری</th>
                            <th>تعداد اعضا</th>
                            <th>مصرف آب (L)</th>
                            <th>مصرف برق (kW)</th>
                            <th>مصرف گاز (m³)</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- توسط JavaScript پر می‌شود -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        import { checkAdminAuth } from './modules/admin-auth.js';
        import { initAdminDashboard } from './modules/admin.js';

        // بررسی احراز هویت
        if (!checkAdminAuth()) {
            window.location.href = 'admin-login.html';
        }

        // مقداردهی اولیه
        document.addEventListener('DOMContentLoaded', initAdminDashboard);
    </script>
</body>
</html>

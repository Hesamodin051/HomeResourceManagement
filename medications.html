<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت داروها | سامانه تدبیر منزل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'vazir': ['Vazirmatn', 'sans-serif'] },
                    colors: { 'primary': '#0f172a', 'secondary': '#3b82f6', 'accent': '#f59e0b' }
                }
            }
        }
    </script>
</head>
<body class="font-vazir bg-gray-50 min-h-screen">

    <!-- ===== هدر ===== -->
    <header class="glass-header sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-pills text-2xl text-secondary"></i>
                <h1 class="text-xl font-bold text-primary">مدیریت داروها</h1>
            </div>
            <div class="flex items-center gap-4">
                <button id="historyBtn" class="btn-outline !py-1 !px-4 text-sm">
                    <i class="fas fa-clock-rotate-left ml-2"></i> تاریخچه مصرف
                </button>
                <div class="hamburger-menu cursor-pointer" id="hamburgerMenu">
                    <i class="fas fa-bars text-2xl text-gray-700"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- ===== هشدارها ===== -->
        <div id="alertContainer" class="space-y-2 mb-6"></div>

        <!-- ===== فرم افزودن دارو ===== -->
        <div class="card-modern p-4 mb-6">
            <h3 class="text-lg font-bold text-primary mb-4">
                <i class="fas fa-plus-circle text-secondary ml-2"></i>
                افزودن داروی جدید
            </h3>
            <form id="medicationForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-3">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">نام دارو *</label>
                    <input type="text" id="medName" class="input-modern" placeholder="نام دارو" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">دوز (مثلاً ۵۰۰mg)</label>
                    <input type="text" id="medDosage" class="input-modern" placeholder="دوز مصرفی">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">تعداد *</label>
                    <input type="number" id="medQuantity" class="input-modern" placeholder="تعداد" min="1" required>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">واحد</label>
                    <select id="medUnit" class="input-modern">
                        <option value="عدد">عدد</option>
                        <option value="قلم">قلم</option>
                        <option value="بطری">بطری</option>
                        <option value="قرص">قرص</option>
                        <option value="میلی‌لیتر">میلی‌لیتر</option>
                        <option value="گرم">گرم</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">زمان مصرف (دقیقه)</label>
                    <input type="text" id="medTimes" class="input-modern" placeholder="مثلاً 08:00,20:00">
                    <p class="text-xs text-gray-400 mt-1">با کاما جدا کنید</p>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">تاریخ انقضا</label>
                    <input type="date" id="medExpiry" class="input-modern">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">شرایط نگهداری</label>
                    <select id="medStorage" class="input-modern">
                        <option value="room">دمای اتاق</option>
                        <option value="refrigerator">یخچال</option>
                        <option value="freezer">فریزر</option>
                        <option value="dark">محیط تاریک</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">یادداشت</label>
                    <input type="text" id="medNotes" class="input-modern" placeholder="یادداشت">
                </div>
                <div class="md:col-span-3 lg:col-span-4 flex gap-2 mt-2">
                    <button type="submit" class="btn-gradient flex-1 justify-center">
                        <i class="fas fa-save ml-2"></i> افزودن دارو
                    </button>
                    <button type="reset" class="btn-outline flex-1 justify-center">
                        <i class="fas fa-eraser ml-2"></i> پاک کردن
                    </button>
                </div>
            </form>
            <div id="formMessage" class="mt-3 text-sm hidden"></div>
        </div>

        <!-- ===== لیست داروها ===== -->
        <div class="card-modern p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-primary">
                    <i class="fas fa-list text-secondary ml-2"></i>
                    لیست داروها
                </h3>
                <span id="medCount" class="text-sm text-gray-500">۰ دارو</span>
            </div>
            <div class="overflow-x-auto">
                <table class="table-modern" id="medicationTable">
                    <thead>
                        <tr>
                            <th>نام</th>
                            <th>دوز</th>
                            <th>تعداد</th>
                            <th>زمان مصرف</th>
                            <th>انقضا</th>
                            <th>نگهداری</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="medicationBody">
                        <tr><td colspan="7" class="text-center text-gray-400">هیچ دارویی ثبت نشده است.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ===== مدال تاریخچه مصرف ===== -->
        <div id="historyModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[80vh] overflow-y-auto p-6 shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-primary">📜 تاریخچه مصرف</h3>
                    <button class="close-modal text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <div id="historyList" class="space-y-2"></div>
            </div>
        </div>

    </main>

    <!-- ===== منوی کشو ===== -->
    <div id="drawer" class="drawer-modern">
        <div class="flex justify-between items-center mb-6">
            <span class="text-lg font-bold text-primary">منو</span>
            <button id="closeDrawerBtn" class="text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        <div id="drawerItems" class="space-y-2"></div>
    </div>
    <div id="drawerBackdrop"></div>

    <!-- ===== ویجت چت‌بات ===== -->
    <div id="chatbotWidget">
        <button class="chatbot-fab" id="chatbotFab" aria-label="دستیار هوشمند">
            <i class="fas fa-robot"></i>
            <span class="badge" id="chatbotBadge" style="display:none;">1</span>
        </button>
        <div class="chatbot-window" id="chatbotWindow">
            <div class="chatbot-header">
                <div class="title"><span class="icon">🤖</span> دستیار هوشمند تدبیر</div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div class="status"><span class="dot"></span><span>آنلاین</span></div>
                    <button class="close-btn" id="chatbotCloseBtn"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="chatbot-messages" id="chatbotMessages">
                <div class="message assistant">سلام! 👋 من دستیار هوشمند سامانه‌ی تدبیر منزل هستم. سوال خود را بپرسید! 😊<span class="time">اکنون</span></div>
                <div class="typing-indicator" id="typingIndicator"><span></span><span></span><span></span></div>
            </div>
            <div class="chatbot-quick-suggestions" id="quickSuggestions">
                <button data-question="وضعیت ذخایر من چگونه است؟">📊 وضعیت ذخایر</button>
                <button data-question="چطور مصرف آب را کاهش دهم؟">💧 کاهش مصرف آب</button>
                <button data-question="برای بحران چه کنم؟">⚠️ راهنمای بحران</button>
                <button data-question="یک برنامه غذایی پیشنهاد بده">🍲 برنامه غذایی</button>
            </div>
            <div class="chatbot-input">
                <textarea id="chatbotInput" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
                <button class="send-btn" id="chatbotSendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- ===== اسکریپت‌ها ===== -->
    <script src="chatbot-widget.js"></script>
    <script type="module" src="medications.js"></script>
</body>
</html>
